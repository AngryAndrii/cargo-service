{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
  <h1>Register</h1>


  {% if form.errors %}
    <div style="color:red">
      <strong>Form errors:</strong>
      {{ form.errors }}
    </div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="mt-3">Register</button>
  </form>
{% endblock %}
