<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  {% block title %}
    <title>Cargo Service</title>
  {% endblock %}
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <div class="col-sm-3">
      <div id="sidebar">
        {% block sidebar %}
          <ul class="list-group">
            <li class="list-group-item"><a href="{% url 'cargo:index' %}">Home</a></li>
            <li class="list-group-item"><a href="{% url 'cargo:truck-list' %}">Truck list</a></li>
            <li class="list-group-item"><a href="{% url 'cargo:order-list' %}">Orders list</a></li>
            <li class="list-group-item">A fourth item</li>
            <li class="list-group-item">And a fifth one</li>
          </ul>
        {% endblock %}
      </div>
    </div>
    <div class="col-sm-9">
      <div id="content">
        {% block content %}
          base content
        {% endblock %}
      </div>
    </div>
  </div>
</div>
</body>
</html>
