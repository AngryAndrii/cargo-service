{% load static %}

{% for truck in page_obj %}

  <li class="list-group-item p-4">
    <div class="row g-3 align-items-start">

      <div class="col-md-8">
        <h5 class="mb-2">
          {{ truck.manufacturer.name }} {{ truck.model }}
        </h5>
        <p class="mb-1">
          Plate number: {{ truck.plate_number }}
        </p>
        <p class="mb-1">
          Tonnage: {{ truck.tonnage }}
        </p>

        <p class="mb-2">
          Rent cost: <b>{{ truck.cost_for_rent }}</b>
        </p>
        <a href="{% url 'cargo:truck-detail' pk=truck.id %}"
           class="btn btn-primary btn-sm">
          detail
        </a>
      </div>

      <div class="col-md-4 text-center">
        <img src="{% static 'models/' %}{{ truck.image }}?{{ truck.id }}"
             alt="{{ truck.model }}"
             class="img-fluid rounded"
             style="max-height: 160px;">
      </div>

    </div>
  </li>

{% endfor %}

{% if page_obj.has_next %}
  <li class="list-group-item text-center"
      id="load-more-container"
      hx-get="?page={{ page_obj.next_page_number }}"
      hx-trigger="click"
      hx-target="#load-more-container"
      hx-swap="outerHTML">
    <button class="btn btn-outline-primary">
      Load More Trucks...
    </button>
  </li>
{% endif %}
