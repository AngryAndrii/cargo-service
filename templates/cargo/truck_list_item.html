{% load static %}

{% for truck in truck_list %}
  <li class="list-group-item p-4">
    <div class="row g-3 align-items-start">

      <div class="col-md-8">
        <h5 class="mb-2">
          {{ truck.manufacturer.name }} {{ truck.model }}
        </h5>
        <p class="mb-1">
          Plate number: {{ truck.plate_number }}
        </p>
        <p class="mb-1">
          Tonnage: {{ truck.tonnage }}
        </p>

        <p class="mb-2">
          Rent cost: <b>{{ truck.cost_for_rent }}</b>
        </p>

        <button hx-get="{% url 'cargo:rent-truck-modal' truck.id %}"
                hx-target="#modals-here"
                hx-swap="innerHTML"
                class="btn btn-primary btn-sm">
          Rent truck
        </button>
      </div>

      <div class="col-md-4 text-center">
        <img src="{% static 'models/' %}{{ truck.image }}?{{ truck.id }}"
             alt="{{ truck.model }}"
             class="img-fluid rounded"
             style="max-height: 160px;">
      </div>

    </div>
  </li>
{% endfor %}

{% if truck_list.has_next %}
  <li class="list-group-item text-center" id="load-more-container">
    <button class="btn btn-outline-primary"
            hx-get="?page={{ truck_list.next_page_number }}"
            hx-target="#load-more-container"
            hx-swap="outerHTML">
      Load More Trucks...
    </button>
  </li>
{% endif %}
